stages:
  - install
  - lint
  - typecheck
  - test
  - build

variables:
  GIT_DEPTH: 1

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/

install:
  stage: install
  script:
    - npm ci --cache .npm --prefer-offline

lint:
  stage: lint
  needs: ['install']
  script:
    - npm run lint

typecheck:
  stage: typecheck
  needs: ['install']
  script:
    - npx tsc --noEmit

test:
  stage: test
  needs: ['install']
  script:
    - npm run test -- --passWithNoTests --coverage
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 30 days

build:web:
  stage: build
  needs: ['install']
  script:
    - npx expo export --platform web
  artifacts:
    name: '$CI_COMMIT_REF_SLUG-frontend-web-build'
    paths:
      - dist/
    expire_in: 7 days
